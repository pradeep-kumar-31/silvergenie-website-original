
name: Deploy SilverGenie to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Wait for GitHub Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..12}; do
            echo "Checking artifact availability: attempt $i"
            ARTIFACT=$(gh api \
              repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts \
              --jq '.artifacts[] | select(.name == "github-pages") | .id' \
              | head -n 1)

            if [ -n "$ARTIFACT" ]; then
              echo "GitHub Pages artifact found: $ARTIFACT"
              exit 0
            fi

            sleep 5
          done

          echo "GitHub Pages artifact was not found."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
